<!doctype html>
<!--
  Before/after screenshot harness for Tom's refrigerator-run rules:
  the refrigerator sits in the cabinet row on one wall line and one front
  (depth) line, and the cabinet above it comes forward flush with its end panel.

  It builds a real kitchen with the real auto-designer and draws it twice:
  the Floor Plan with the real PlanCanvas, and the room with the real 3D
  engine (addCabinet + existingCabinetTransform). Nothing here is hand-drawn.

  Dev-only: served at /dev/fridge-shot.html, imported by nothing in the app.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Refrigerator run check</title>
    <style>
      html, body { margin: 0; height: 100%; background: #eef1f4; font-family: system-ui, sans-serif; }
      #root { display: grid; grid-template-rows: auto 1fr; height: 100vh; box-sizing: border-box; padding: 8px; gap: 8px; }
      #panes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-height: 0; }
      .pane { position: relative; border-radius: 10px; overflow: hidden; background: #fff; min-height: 0; }
      .pane > .mount { position: absolute; inset: 0; }
      .tag { position: absolute; z-index: 60; left: 10px; top: 10px; padding: 6px 10px; border-radius: 8px; font-size: 12px;
        font-weight: 700; background: rgba(255,255,255,0.96); box-shadow: 0 4px 14px rgba(15,23,42,0.16); color: #0f172a; }
      #caption { padding: 10px 14px; border-radius: 10px; background: #fff; box-shadow: 0 6px 18px rgba(15,23,42,0.12);
        color: #0f172a; font-size: 13px; line-height: 1.55; }
      #caption b { font-size: 14px; }
      #caption .ok { color: #047857; font-weight: 700; }
      #caption .bad { color: #b91c1c; font-weight: 700; }
      #caption .dim { color: #475569; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="caption">Building…</div>
      <div id="panes">
        <div class="pane" id="pane-plan"><div class="tag">Floor plan</div><div class="mount" id="mount-plan"></div></div>
        <div class="pane" id="pane-3d"><div class="tag">3D</div><div class="mount" id="mount-3d"></div></div>
      </div>
    </div>
    <script type="module" src="/src/fridgeRunScreenshotHarness.tsx"></script>
  </body>
</html>
