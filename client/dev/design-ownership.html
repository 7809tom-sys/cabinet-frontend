<!doctype html>
<!--
  Screenshot harness for the design-ownership fix (owner-reported: a design opened
  under the wrong store, and a new save that never appeared on the person's login).

  Every value in the page comes from the real modules the app ships —
  designOwnerScope, designDraftOwnership, and the real groupByProject the
  "My designs" dialog uses — so the before/after difference is the code change,
  not a drawing.

  Served by the Vite dev server at /dev/design-ownership.html; used only by
  e2e/design-ownership-screenshot.spec.ts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Design ownership check</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f4f6f9; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #0f172a; }
      #root { padding: 20px 22px 28px; }
      .strip h1 { margin: 0; font-size: 21px; letter-spacing: -0.01em; }
      .strip p { margin: 5px 0 0; font-size: 12.5px; color: #475569; }
      .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-top: 16px; align-items: start; }
      .stack { display: flex; flex-direction: column; gap: 14px; }
      .panel { background: #fff; border: 1px solid #dbe1ea; border-radius: 12px; padding: 13px 14px 14px; box-shadow: 0 2px 10px rgba(15,23,42,.05); }
      .head { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding-bottom: 7px; border-bottom: 1px solid #e8edf3; }
      .head.bad { color: #9f1239; }
      .head.good { color: #047857; }
      .head.info { color: #1d4ed8; }
      .caption { margin: 0 0 9px; font-size: 11.5px; line-height: 1.45; color: #475569; }
      .caption.bad { color: #9f1239; }
      .caption.good { color: #047857; }
      .caption.info { color: #1d4ed8; }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; padding: 8px 0; border-top: 1px dashed #e8edf3; }
      .row:first-of-type { border-top: 0; }
      .name { margin: 0; font-size: 12.5px; font-weight: 650; }
      .meta { margin: 2px 0 0; font-size: 10.5px; color: #64748b; }
      .note { margin: 4px 0 0; font-size: 10.5px; line-height: 1.4; }
      .note.bad { color: #9f1239; }
      .note.good { color: #047857; }
      .link { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; padding: 3px 6px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/designOwnershipHarness.ts"></script>
  </body>
</html>
