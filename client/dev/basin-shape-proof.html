<!doctype html>
<!--
  Incontrovertible proof that a basin drawn from a "circle"/"oval" specification is
  an ellipse and not a rounded rectangle.

  Renders the two exported bowl geometries side by side from directly above, with
  no app shell, no room, and no camera controls that could drift. Used to produce
  the basin-shape artifacts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Basin bowl geometry — ellipse vs rounded rectangle</title>
    <style>
      html, body { margin: 0; background: #3a4550; color: #f2f6f9; font-family: system-ui, sans-serif; }
      #root { padding: 18px; }
      h1 { font-size: 19px; margin: 0 0 4px; }
      p { margin: 0 0 14px; font-size: 12.5px; color: #9aa6b2; max-width: 980px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .cell { background: #2a333c; border-radius: 10px; padding: 10px; }
      .cap { font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
      .sub { font-size: 11.5px; color: #93a1ae; margin-top: 6px; line-height: 1.5; }
      canvas { display: block; width: 100%; height: auto; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/basinShapeProof.tsx"></script>
  </body>
</html>
