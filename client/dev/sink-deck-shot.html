<!doctype html>
<!--
  Before/after harness for the bathroom rear-deck rule.

  Renders the real Floor Plan twice from the same design model — a 30" Pelican
  vanity basin on a 30" × 21" vanity sink base between two 3VDB15 drawer bases —
  so the retired red "REAR DECK TOO SHALLOW" label and the new neutral advisory
  can be compared side by side.

  Served by the Vite dev server at /dev/sink-deck-shot.html; used only by
  e2e/bathroom-sink-deck-screenshot.spec.ts. Not part of the app bundle: no route
  points at it and nothing imports it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bathroom sink rear deck — before / after</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #eef1f4; font-family: system-ui, sans-serif; }
      #root { padding: 14px; }
      .shell { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: start; }
      .pane {
        position: relative; background: #fff; border-radius: 12px;
        box-shadow: 0 8px 24px rgba(15,23,42,0.10); padding: 12px; overflow: hidden;
      }
      .tag {
        display: inline-block; margin-bottom: 8px; padding: 5px 10px; border-radius: 8px;
        font-size: 12px; font-weight: 700; color: #0f172a; background: #f1f5f9; border: 1px solid #cbd5e1;
      }
      .facts { font-size: 11.5px; line-height: 1.65; color: #334155; margin-bottom: 10px; }
      .facts b { color: #0f172a; }
      .facts .bad { margin-top: 5px; font-weight: 700; color: #b91c1c; }
      .facts .ok { margin-top: 5px; font-weight: 700; color: #0f766e; }
      /* PlanCanvas lays itself out with w-full h-full, so it needs a sized box. */
      .plan-wrap { height: 420px; width: 100%; position: relative; }
      /*
        The retired red label, reproduced for the BEFORE pane only. It matches the
        removed PlanCanvas badge: rose-700, white bold, centred on the basin.
      */
      .badge-before {
        position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
        z-index: 5; padding: 2px 4px; border-radius: 3px; background: #be123c;
        color: #fff; font-size: 8px; font-weight: 700; white-space: nowrap;
        box-shadow: 0 1px 2px rgba(0,0,0,0.25);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bathroomSinkDeckHarness.tsx"></script>
  </body>
</html>
