<!doctype html>
<!--
  Proof harness for the cart/design reconciliation.

  Reproduces the reported design — one vanity with a countertop, one basin, one gold
  faucet, one black toilet, one tall linen cabinet — and shows what the cart held
  under the old rule versus what it holds now.

  Served by the Vite dev server at /dev/cart-matches-design.html. Nothing in the app
  imports it and no route points at it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cart matches the design</title>
    <style>
      html, body { margin: 0; background: #f2f5f8; font-family: system-ui, -apple-system, sans-serif; color: #0f172a; }
      #root { padding: 20px; }
      h1 { font-size: 20px; margin: 0 0 6px; }
      .lede { font-size: 12.5px; color: #475569; max-width: 1040px; margin: 0 0 16px; line-height: 1.55; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
      .card { background: #fff; border-radius: 12px; box-shadow: 0 8px 22px rgba(15,23,42,.09); overflow: hidden; }
      .head { padding: 10px 14px; font-weight: 700; font-size: 13px; }
      .head.bad { background: #fee2e2; color: #991b1b; }
      .head.good { background: #dcfce7; color: #166534; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th { text-align: left; padding: 7px 14px; color: #64748b; font-weight: 600; border-bottom: 1px solid #e2e8f0; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
      td { padding: 7px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
      tr.orphan td { background: #fff1f2; color: #9f1239; }
      tr.keep td { color: #0f172a; }
      .tag { display: inline-block; padding: 1px 6px; border-radius: 5px; font-size: 10px; font-weight: 700; }
      .tag.orphan { background: #fecdd3; color: #881337; }
      .tag.keep { background: #dbeafe; color: #1e40af; }
      .foot { padding: 10px 14px; font-size: 12.5px; border-top: 1px solid #e2e8f0; background: #f8fafc; }
      .foot b { font-variant-numeric: tabular-nums; }
      .design { margin-top: 18px; background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 8px 22px rgba(15,23,42,.09); }
      .design h2 { font-size: 13px; margin: 0 0 8px; }
      .design ul { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.7; color: #334155; }
      .note { margin-top: 10px; font-size: 11.5px; color: #64748b; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/cartMatchesDesignHarness.tsx"></script>
  </body>
</html>
